[package]
name = "wanna_ls"
version = "0.1.2"
edition = "2021"

authors = ["Yuki SUZUKI <y-suzuki@radiol.med.osaka-u.ac.jp>"]
repository = "https://github.com/ykszk/wanna_ls"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.50", features = ["derive"] }
clap_complete = "4.5.59"
env_logger = "0.11.8"
log = "0.4.28"
tokio = { version = "1.48.0", features = ["fs", "macros", "time", "rt"] }

[dev-dependencies]
pretty_assertions = "1.4.0"

[profile.release]
lto = true
opt-level = 3
strip = true
